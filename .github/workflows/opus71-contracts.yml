name: Opus 7.1 contracts
on:
  push:
    branches: ['codex/opus71-c5-test']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y libgstreamer1.0-dev libopus-dev
      - run: tests/run-opus71-tests.sh
